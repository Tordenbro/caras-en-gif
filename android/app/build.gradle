plugins {
    id 'com.android.application'
}

def vCode = (System.getenv('VERSION_CODE') ?: '1').toInteger()

android {
    namespace 'com.tordenbro.carasengif'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tordenbro.carasengif'
        minSdk 29
        targetSdk 34
        versionCode vCode
        versionName "1.0.${vCode}"
    }

    signingConfigs {
        release {
            storeFile file('../keystore/caras.jks')
            storePassword 'carasengif'
            keyAlias 'caras'
            keyPassword 'carasengif'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
