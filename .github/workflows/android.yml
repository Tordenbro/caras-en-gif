name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Meter el editor dentro de la app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html icon-192.png android/app/src/main/assets/www/

      - name: Compilar APK firmado
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk "CarasEnGif-v1.0.${{ github.run_number }}.apk"

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Caras en GIF v1.0.${{ github.run_number }}
          body: |
            Descarga el archivo .apk de abajo e instálalo en el móvil.
            Se instala encima de la versión anterior (misma firma).
          files: CarasEnGif-v1.0.${{ github.run_number }}.apk
          make_latest: true
